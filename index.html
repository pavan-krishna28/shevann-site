<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Shevann — a Bengaluru digital agency and product studio, and a hands-on internship academy." />
    <title>Shevann — Studio & Academy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Netlify detects forms by scanning the BUILT static HTML for a <form data-netlify="true">.
      Because this site is a React SPA, the real form only exists in the DOM at runtime, so this
      hidden, hardcoded twin (never shown to visitors) is what lets Netlify's build-time crawler
      register the form and its exact field names. The live React form in Contact.jsx submits to
      "/" with matching field names via fetch — see that file for details. Do not remove this or
      the contact form will silently stop delivering email.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="type" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
